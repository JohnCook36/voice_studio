[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-studio-local"
version = "0.1.0a1"
description = "Offline-first, license-aware Russian TTS desktop prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
qwen = ["qwen-tts", "torch", "soundfile"]
dev = ["pytest>=8,<10"]

[project.scripts]
voice-studio = "voice_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
