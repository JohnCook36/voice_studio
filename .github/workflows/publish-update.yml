name: Publish Voice Studio update

# A new release is an intentional versioned tag on the main branch.
# Successful CI alone does not publish updates to end users.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag and main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          version=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("src/voice_studio/__init__.py").read_text()
          match = re.search(r'^__version__\s*=\s*["\x27]([^"\x27]+)', text, re.M)
          if not match:
              raise SystemExit("Missing version")
          print(match.group(1))
          PY
          )
          test "$GITHUB_REF_NAME" = "v$version"
          echo "VOICE_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Run offline unit regression tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q

      - name: Bundle source-only app without user data or model weights
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("src")
          with ZipFile("voice_studio_source.zip", "w", compression=ZIP_DEFLATED) as z:
              for file in sorted((root/"voice_studio").rglob("*.py")):
                  z.write(file, file.relative_to(root).as_posix())
          PY
          sha256sum voice_studio_source.zip > SHA256SUMS.txt

      - name: Publish GitHub Release with SHA-256 asset digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "Release already exists; refusing overwrite"
              exit 1
          fi
          prerelease=""
          if [[ "$VOICE_RELEASE_VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
              prerelease="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" voice_studio_source.zip SHA256SUMS.txt \
              --title "Voice Studio $VOICE_RELEASE_VERSION" \
              --generate-notes $prerelease
